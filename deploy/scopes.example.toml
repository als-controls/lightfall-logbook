# Scoped settings server config. Point SCOPES_CONFIG at a copy of this file.
# The beamlines/branches here seed the server's scope tree at startup (add-only); after
# that facility admins manage the tree in Lightfall (Settings > Advanced > Scopes).

[facility]
label = "ALS"

[[beamline]]
name = "7.0.1"
branches = ["7.0.1.1", "7.0.1.2"]

# Optional; replaces the defaults when present (these ARE the defaults).
[facility_grants]
"/beamlines/_all/admin" = "admin"
"/beamlines/_all/owner" = "owner"
"/BCG_staff" = "maintainer"

# Pre-approved keys: lightfall_settings.spec_from_dict fields minus "key".
[seed."voice.wake_word"]
type = "str"
scopes = ["branch", "user"]
operator_writable = true

# Optional shared-content limits (plans, plugins, agents, skills published to a scope).
# Admins/owners of the target scope are exempt from the first three; nobody can exceed
# hard_max_bundle_bytes, the largest upload the server accepts. Sizes in bytes.
# [content]
# max_bundle_bytes = 52428800          # 50 MiB compressed
# max_uncompressed_bytes = 209715200   # 200 MiB, as declared by the uploader
# max_files = 2000                     # as declared by the uploader
# hard_max_bundle_bytes = 524288000    # 500 MiB
